<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag is crucial for mobile games: it disables zooming and scrolling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chrono-Breach</title>
    
    <!-- Supabase Database Connection -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            overflow: hidden; /* Prevents scrollbars */
            touch-action: none; /* Prevents browser swipe gestures on mobile */
            font-family: 'Courier New', Courier, monospace;
            color: #00ff41;
        }
        
        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none; /* Lets touches pass through to the canvas */
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            background: rgba(0, 20, 0, 0.9);
            padding: 30px;
            border: 2px solid #00ff41;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #00ff41;
            color: #000;
            border: none;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h2>ID: <span id="player-id">GUEST</span></h2>
        <h2>SCORE: <span id="score">0</span></h2>
    </div>

        <div id="game-over">
        <h1>SYSTEM FAILURE</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        
        <!-- NEW: Leaderboard Section -->
        <div id="leaderboard" style="margin-top: 20px; text-align: left; background: rgba(0,255,65,0.1); padding: 10px;">
            <h3 style="color: #fff; margin-bottom: 10px;">> TOP 5 HACKERS</h3>
            <ol id="leaderboard-list" style="padding-left: 20px; margin: 0;"></ol>
        </div>

        <button onclick="location.reload()">REBOOT SYSTEM</button>
    </div>


    <canvas id="gameCanvas"></canvas>

    <script>
        // --- 1. DATABASE SETUP ---
const supabaseUrl = 'https://dymotejowsjzmuysxkbl.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5bW90ZWpvd3Nqem11eXN4a2JsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NTAxNzAsImV4cCI6MjEwNTEyNjE3MH0.Uvisey08Z32yzmJ4hozSv77VmdS7-ysEEulx9GhIv3U';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

const playerID = localStorage.getItem("currentUserGDBP") || "GUEST-123";
document.getElementById('player-id').innerText = playerID;

        
        // Retrieve ID from Login Page
        const playerID = localStorage.getItem("currentUserGDBP") || "GUEST-123";
        document.getElementById('player-id').innerText = playerID;

        // --- 2. GAME SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Make canvas full screen
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- 3. CROSS-PLATFORM INPUT CONTROLLER ---
        const input = {
            x: 0, 
            y: 0,
            active: false,
            keys: { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false }
        };

        // Keyboard Events (PC)
        window.addEventListener('keydown', (e) => {
            if(input.keys.hasOwnProperty(e.key)) {
                input.keys[e.key] = true;
                updateKeyboardInput();
            }
        });
        window.addEventListener('keyup', (e) => {
            if(input.keys.hasOwnProperty(e.key)) {
                input.keys[e.key] = false;
                updateKeyboardInput();
            }
        });

        function updateKeyboardInput() {
            input.x = 0; input.y = 0;
            if(input.keys.w || input.keys.ArrowUp) input.y = -1;
            if(input.keys.s || input.keys.ArrowDown) input.y = 1;
            if(input.keys.a || input.keys.ArrowLeft) input.x = -1;
            if(input.keys.d || input.keys.ArrowRight) input.x = 1;
            
            // Normalize diagonal speed
            if(input.x !== 0 && input.y !== 0) {
                input.x *= 0.707;
                input.y *= 0.707;
            }
            input.active = (input.x !== 0 || input.y !== 0);
        }

        // Touch & Mouse Events (Mobile & PC Dragging)
        let dragStartX = 0;
        let dragStartY = 0;

        function handleDragStart(x, y) {
            dragStartX = x;
            dragStartY = y;
            input.active = true;
        }

        function handleDragMove(x, y) {
            if (!input.active) return;
            let dx = x - dragStartX;
            let dy = y - dragStartY;
            let distance = Math.sqrt(dx * dx + dy * dy);
            
            // Create a virtual joystick feel
            if (distance > 0) {
                input.x = dx / distance;
                input.y = dy / distance;
            }
        }

        function handleDragEnd() {
            input.active = false;
            input.x = 0;
            input.y = 0;
            updateKeyboardInput(); // Fallback in case keys are still pressed
        }

        // Mobile Touch Listeners
        canvas.addEventListener('touchstart', (e) => handleDragStart(e.touches[0].clientX, e.touches[0].clientY));
        canvas.addEventListener('touchmove', (e) => handleDragMove(e.touches[0].clientX, e.touches[0].clientY));
        canvas.addEventListener('touchend', handleDragEnd);

        // PC Mouse Listeners
        canvas.addEventListener('mousedown', (e) => handleDragStart(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', (e) => handleDragMove(e.clientX, e.clientY));
        canvas.addEventListener('mouseup', handleDragEnd);

        // --- 4. GAME OBJECTS & LOGIC ---
        let score = 0;
        let isGameOver = false;
        
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 20,
            speed: 5,
            color: '#00ff41'
        };

        const enemies = [];
        let frameCount = 0;

        function spawnEnemy() {
            // Spawn outside the screen edges
            let side = Math.floor(Math.random() * 4);
            let ex, ey;
            if(side === 0) { ex = Math.random() * canvas.width; ey = -30; } // Top
            if(side === 1) { ex = canvas.width + 30; ey = Math.random() * canvas.height; } // Right
            if(side === 2) { ex = Math.random() * canvas.width; ey = canvas.height + 30; } // Bottom
            if(side === 3) { ex = -30; ey = Math.random() * canvas.height; } // Left

            enemies.push({ x: ex, y: ey, size: 15, speed: 2, color: '#ff003c' });
        }

        // --- 5. THE MAIN GAME LOOP ---
        function update() {
            if(isGameOver) return;

            // THE CHRONO-BREACH MECHANIC: Time scales based on player input
            const timeScale = input.active ? 1.0 : 0.05;

            // Move Player
            player.x += input.x * player.speed;
            player.y += input.y * player.speed;
            
            // Keep player on screen
            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

            // Manage Enemies
            frameCount += timeScale;
            if(frameCount > 60) {
                spawnEnemy();
                frameCount = 0;
            }

            for(let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                
                // Enemies chase player, but respect the timeScale!
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                e.x += (dx / dist) * e.speed * timeScale;
                e.y += (dy / dist) * e.speed * timeScale;

                // Collision detection (Game Over)
                if(dist < player.size/2 + e.size/2) {
                    endGame();
                }

                // If time is moving (player moving), auto-destroy enemies close to player (Simulated shooting)
                if(input.active && dist < 100) {
                    enemies.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                }
            }

            draw(timeScale);
            requestAnimationFrame(update);
        }

        function draw(timeScale) {
            // If time is slow, draw a darker trail effect
            ctx.fillStyle = timeScale === 1.0 ? 'rgba(5, 5, 5, 0.5)' : 'rgba(5, 5, 5, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Auto-Aim Radius (Only visible when moving)
            if(input.active) {
                ctx.beginPath();
                ctx.arc(player.x, player.y, 100, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0, 255, 65, 0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow

            // Draw Enemies
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = e.color;
                ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
            });
            ctx.shadowBlur = 0;
        }

        async function endGame() {
    isGameOver = true;
    document.getElementById('game-over').style.display = 'block';
    document.getElementById('final-score').innerText = score;

    // Send the score to the Supabase Database
    if (playerID !== "GUEST-123") {
        const { data, error } = await supabase
            .from('Game_Stats')
            .insert([
                { GDBP_NUMBER: playerID, Score: score }
            ]);
            
        if (error) {
            console.error("Error saving score:", error);
        } else {
            console.log("Score saved successfully!");
        }
    }
}


        // Start the game loop
        update();

    </script>
</body>
</html>
